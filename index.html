<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Beam Stream - A modern web-based screen recording application">
    <title>Beam Stream</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="dist/styles.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto w-full flex flex-col h-full gap-6">
        <!-- Main content area -->
        <div class="flex-1 flex flex-col gap-6">
            <!-- Canvas container -->
            <div class="canvas-container">
                <canvas id="mainCanvas"></canvas>
                <video id="screenSource" autoplay playsinline></video>
                <video id="cameraSource" autoplay playsinline></video>
            </div>

            <!-- Controls -->
            <div class="flex items-center justify-center gap-4 bg-surface rounded-full p-4 mx-auto">
                <!-- Audio controls -->
                <div class="flex items-center gap-2 pr-4 border-r border-gray-700">
                    <button id="micAudioToggle" class="control-button toggle-active" title="Toggle Microphone">
                        <i data-lucide="mic" class="w-6 h-6"></i>
                    </button>
                    <button id="systemAudioToggle" class="control-button toggle-active" title="Toggle System Audio">
                        <i data-lucide="speaker" class="w-6 h-6"></i>
                    </button>
        </div>

                <!-- Camera controls -->
                <div class="flex items-center gap-2 pr-4 border-r border-gray-700">
                    <button id="cameraToggle" class="control-button toggle-inactive" title="Toggle Camera">
                        <i data-lucide="video" class="w-6 h-6 camera-icon"></i>
                        <i data-lucide="video-off" class="w-6 h-6 camera-off-icon hidden"></i>
                    </button>
        </div>

                <!-- Recording controls -->
                <div class="flex items-center gap-4">
                    <button id="previewScreenButton" class="control-button" title="Preview Screen">
                        <i data-lucide="monitor" class="w-6 h-6"></i>
            </button>
                    <button id="recordButton" class="control-button" title="Start Recording">
                        <i data-lucide="circle-dot" class="w-6 h-6 record-icon"></i>
                        <i data-lucide="square" class="w-6 h-6 stop-icon hidden"></i>
            </button>
                    <button id="saveButton" class="control-button" disabled title="Save Recording">
                        <i data-lucide="save" class="w-6 h-6"></i>
            </button>
                    <div class="relative">
                        <button id="settingsButton" class="control-button" title="Settings">
                            <i data-lucide="settings" class="w-6 h-6"></i>
            </button>
                        <!-- Settings Popover -->
                        <div id="settingsPopover" class="hidden absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 w-80 bg-surface rounded-lg shadow-lg border border-gray-700 py-2 z-50" style="margin-left: calc(-1 * (var(--settings-button-width) / 2));">
                            <div class="px-4 py-3 border-b border-gray-700">
                                <h3 class="text-sm font-semibold text-white flex items-center gap-2">
                                    <i data-lucide="settings" class="w-4 h-4"></i>
                                    Camera Effects
                                </h3>
                            </div>
                            <div class="px-4 py-3 space-y-4">
                                <!-- Drop Shadow Toggle -->
                                <div class="flex items-center justify-between checkbox-wrapper">
                                    <div class="flex items-center gap-3">
                                        <div class="relative">
                                            <input type="checkbox" id="dropShadowToggle" class="peer sr-only" checked>
                                            <div class="w-11 h-6 bg-gray-600 rounded-full peer-checked:bg-primary transition-colors duration-200 ease-in-out"></div>
                                            <div class="absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full transition-transform duration-200 ease-in-out peer-checked:translate-x-5"></div>
                                        </div>
                                        <label for="dropShadowToggle" class="text-sm text-gray-300 cursor-pointer select-none">Drop Shadow</label>
                                    </div>
                                </div>

                                <!-- Stroke Toggle -->
                                <div class="space-y-3 checkbox-wrapper">
                                    <div class="flex items-center justify-between">
                                        <div class="flex items-center gap-3">
                                            <div class="relative">
                                                <input type="checkbox" id="strokeToggle" class="peer sr-only" checked>
                                                <div class="w-11 h-6 bg-gray-600 rounded-full peer-checked:bg-primary transition-colors duration-200 ease-in-out"></div>
                                                <div class="absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full transition-transform duration-200 ease-in-out peer-checked:translate-x-5"></div>
                                            </div>
                                            <label for="strokeToggle" class="text-sm text-gray-300 cursor-pointer select-none">Stroke</label>
                                        </div>
                                    </div>

                                    <!-- Stroke Options -->
                                    <div id="strokeOptions" class="pl-14 space-y-3">
                                        <!-- Stroke Width -->
                                        <div id="strokeWidthContainer" class="flex items-center justify-between">
                                            <label class="text-sm text-gray-300">Width</label>
                                            <div class="flex items-center gap-2">
                                                <input type="range" id="strokeWidth" min="1" max="5" value="2" 
                                                       class="w-24 h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer accent-primary">
                                                <span id="strokeWidthValue" class="text-xs text-gray-400 w-8 text-right">2px</span>
                                            </div>
                                        </div>

                                        <!-- Stroke Color -->
                                        <div id="strokeColorContainer" class="flex items-center justify-between">
                                            <label class="text-sm text-gray-300">Color</label>
                                            <div class="flex items-center gap-2">
                                                <input type="color" id="strokeColor" value="#FFFFFF" 
                                                       class="w-8 h-8 rounded cursor-pointer bg-transparent border border-gray-600">
                                                <span id="strokeColorValue" class="text-xs text-gray-400 w-16 text-right">#FFFFFF</span>
                                            </div>
                                        </div>
                                    </div>
        </div>

                                <!-- Pulse Effect Toggle -->
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-3">
                                        <div class="relative">
                                            <input type="checkbox" id="pulseEffectToggle" class="peer sr-only">
                                            <div class="w-11 h-6 bg-gray-600 rounded-full peer-checked:bg-primary transition-colors duration-200 ease-in-out"></div>
                                            <div class="absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full transition-transform duration-200 ease-in-out peer-checked:translate-x-5"></div>
                                        </div>
                                        <label for="pulseEffectToggle" class="text-sm text-gray-300 cursor-pointer select-none">Pulse Effect</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Notification -->
            <div id="notification" class="notification">
                <div class="notification-content">
                    <i data-lucide="info" class="notification-icon"></i>
                    <p class="notification-message"></p>
                </div>
                <button class="notification-close" title="Close notification">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { ScreenRecorderApp } from './src/js/app.js';

        document.addEventListener('DOMContentLoaded', () => {
            try {
                // Initialize Lucide icons
                lucide.createIcons();
                
                // Initialize app and store instance
                const app = new ScreenRecorderApp();
                document.querySelector('script[type="module"]').__app = app;
                
                // Cleanup on page unload
                window.addEventListener('unload', () => {
                    app.cleanup();
                    if (notificationTimeout) {
                        clearTimeout(notificationTimeout);
                    }
                });
                
                // Notification management
                const notification = document.getElementById('notification');
                const notificationMessage = notification.querySelector('.notification-message');
                const notificationIcon = notification.querySelector('.notification-icon');
                const closeButton = notification.querySelector('.notification-close');
                let notificationTimeout = null;

                const showNotification = (message, type = 'info', duration = 10000) => {
                    // Clear any existing timeout
                    if (notificationTimeout) {
                        clearTimeout(notificationTimeout);
                    }

                    // Update notification content
                    notificationMessage.textContent = message;
                    
                    // Update icon based on type
                    const iconMap = {
                        success: 'check-circle',
                        error: 'alert-circle',
                        info: 'info'
                    };
                    notificationIcon.setAttribute('data-lucide', iconMap[type] || 'info');
                    lucide.createIcons();

                    // Update notification type
                    notification.className = 'notification';
                    notification.classList.add(type);
                    notification.classList.add('show');

                    // Set auto-dismiss timeout
                    notificationTimeout = setTimeout(() => {
                        hideNotification();
                    }, duration);
                };

                const hideNotification = () => {
                    notification.classList.remove('show');
                    if (notificationTimeout) {
                        clearTimeout(notificationTimeout);
                        notificationTimeout = null;
                    }
                };

                // Close button handler
                closeButton.addEventListener('click', hideNotification);

                // Make notification available globally
                window.showNotification = showNotification;
                
                // Handle settings popover visibility and toggles
                const dropShadowToggle = document.getElementById('dropShadowToggle');
                const strokeToggle = document.getElementById('strokeToggle');
                const pulseEffectToggle = document.getElementById('pulseEffectToggle');
                const strokeWidthContainer = document.getElementById('strokeWidthContainer');
                const strokeColorContainer = document.getElementById('strokeColorContainer');
                const strokeWidth = document.getElementById('strokeWidth');
                const strokeWidthValue = document.getElementById('strokeWidthValue');
                const strokeColor = document.getElementById('strokeColor');
                const strokeColorValue = document.getElementById('strokeColorValue');

                // Function to update checkbox UI
                const updateCheckboxUI = (checkbox, customCheckbox) => {
                    if (checkbox.checked) {
                        customCheckbox.classList.add('checked');
                    } else {
                        customCheckbox.classList.remove('checked');
                    }
                };

                // Initialize checkbox states
                [dropShadowToggle, strokeToggle, pulseEffectToggle].forEach(checkbox => {
                    if (!checkbox) {
                        console.warn(`Checkbox element not found: ${checkbox?.id}`);
                        return;
                    }
                    
                    const wrapper = checkbox.closest('.checkbox-wrapper');
                    if (!wrapper) {
                        console.warn(`Checkbox wrapper not found for: ${checkbox.id}`);
                        return;
                    }

                    // Add click handler to the wrapper
                    wrapper.addEventListener('click', (e) => {
                        if (e.target !== checkbox) {
                            checkbox.checked = !checkbox.checked;
                            document.dispatchEvent(new CustomEvent('settingsChange', {
                                detail: { setting: checkbox.id.replace('Toggle', '').toLowerCase(), value: checkbox.checked }
                            }));
                        }
                    });
                });
                
                // Show/hide stroke options based on toggle state
                const updateStrokeOptions = () => {
                    const isEnabled = strokeToggle.checked;
                    strokeWidthContainer.style.display = isEnabled ? 'flex' : 'none';
                    strokeColorContainer.style.display = isEnabled ? 'flex' : 'none';
                };
                
                // Update stroke width display
                strokeWidth.addEventListener('input', (e) => {
                    const value = e.target.value;
                    strokeWidthValue.textContent = `${value}px`;
                    document.dispatchEvent(new CustomEvent('settingsChange', {
                        detail: { setting: 'strokeWidth', value: parseInt(value) }
                    }));
                });
                
                // Update stroke color display
                strokeColor.addEventListener('input', (e) => {
                    const value = e.target.value;
                    strokeColorValue.textContent = value.toUpperCase();
                    document.dispatchEvent(new CustomEvent('settingsChange', {
                        detail: { setting: 'strokeColor', value }
                    }));
                });
                
                // Initialize stroke options visibility
                updateStrokeOptions();
                
                // Update stroke options when toggle changes
                strokeToggle.addEventListener('change', updateStrokeOptions);
                
                // Handle toggle button states
                const toggleButtons = document.querySelectorAll('#micAudioToggle, #systemAudioToggle');
                toggleButtons.forEach(button => {
                    button.addEventListener('click', () => {
                        const isActive = button.classList.contains('toggle-active');
                        button.classList.toggle('toggle-active', !isActive);
                        button.classList.toggle('toggle-inactive', isActive);
                        
                        // Dispatch settings change event
                        const setting = button.id === 'micAudioToggle' ? 'mic' : 'systemAudio';
                        document.dispatchEvent(new CustomEvent('settingsChange', {
                            detail: { setting, value: !isActive }
                        }));
                    });
                });
                
                // Handle camera toggle
                const cameraToggle = document.getElementById('cameraToggle');
                const cameraIcon = cameraToggle.querySelector('.camera-icon');
                const cameraOffIcon = cameraToggle.querySelector('.camera-off-icon');

                cameraToggle.addEventListener('click', () => {
                    const isCurrentlyActive = cameraToggle.classList.contains('toggle-active');
                    
                    // Update button state
                    if (!isCurrentlyActive) {
                        cameraIcon.classList.remove('hidden');
                        cameraOffIcon.classList.add('hidden');
                        cameraToggle.classList.remove('toggle-inactive');
                        cameraToggle.classList.add('toggle-active');
                    } else {
                        cameraIcon.classList.add('hidden');
                        cameraOffIcon.classList.remove('hidden');
                        cameraToggle.classList.remove('toggle-active');
                        cameraToggle.classList.add('toggle-inactive');
                    }

                    // Dispatch event with correct structure
                    document.dispatchEvent(new CustomEvent('cameraStateChanged', {
                        detail: {
                            videoEnabled: !isCurrentlyActive,
                            audioEnabled: false  // Audio will be handled separately
                        }
                    }));
                });

                // Handle record button icon toggle
                const recordButton = document.getElementById('recordButton');
                const recordIcon = recordButton.querySelector('.record-icon');
                const stopIcon = recordButton.querySelector('.stop-icon');

                document.addEventListener('recordingStateChanged', (event) => {
                    const { isRecording } = event.detail;
                    if (isRecording) {
                        recordIcon.classList.add('hidden');
                        stopIcon.classList.remove('hidden');
                    } else {
                        recordIcon.classList.remove('hidden');
                        stopIcon.classList.add('hidden');
                    }
                });
            } catch (error) {
                console.error('Failed to initialize application:', error);
                window.showNotification('Failed to initialize application. Please refresh the page.', 'error');
            }
        });
    </script>

    <script>
        // Add CSS variable for settings button width
        document.documentElement.style.setProperty('--settings-button-width', '48px'); // 12 * 4 = 48px (w-12)
    </script>
</body>
</html>
